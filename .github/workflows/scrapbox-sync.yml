name: Validate and sync Scrapbox

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrapbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run sync:plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scrapbox-single-page
          path: dist/kame-layout.scrapbox.json
          retention-days: 7

  delivery-browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: node tools/delivery-check.mjs
      - run: node tools/delivery-check.mjs --webkit

  publish:
    needs: [validate, delivery-browser]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.SCRAPBOX_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Update delivery and managed native UserCSS, then verify both
        run: npm run sync:publish
        env:
          SCRAPBOX_SID: ${{ secrets.SCRAPBOX_SID }}
      - name: Save the previous delivery page for rollback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: previous-delivery-page
          path: .cache/scrapbox-sync/previous.scrapbox.json
          if-no-files-found: ignore
          retention-days: 7

  legacy-cleanup-once:
    needs: [validate, delivery-browser]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/19-cleanup-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm install --prefix "$RUNNER_TEMP/legacy-cleanup" --no-package-lock --ignore-scripts socket.io-client@4.8.1
      - name: Remove only the 73 audited legacy pages and verify retained pages
        run: node tools/one-off/legacy-cleanup.mjs
        env:
          SCRAPBOX_SID: ${{ secrets.SCRAPBOX_SID }}
          LEGACY_RUNTIME: ${{ runner.temp }}/legacy-cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacy-cleanup-backup
          path: .cache/legacy-cleanup/
          retention-days: 30
